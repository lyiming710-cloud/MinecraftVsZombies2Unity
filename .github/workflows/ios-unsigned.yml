name: Build MVZ2 unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Optional app version override (leave blank to auto-detect from Changelog)"
        required: false
        default: ""
        type: string
      build_number:
        description: "Optional iOS CFBundleVersion override (leave blank to auto-derive from app version)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - "ios-*"
      - "ios-unsigned"
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_BUNDLE_ID: "com.cuerzor.minecraftVSZombies2"

jobs:
  build-ios:
    name: Unity iOS -> unsigned IPA
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      unity_error_summary: ${{ steps.unity_error.outputs.summary }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 0

      - name: Resolve Unity version and app version metadata
        id: meta
        shell: bash
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pv_path = Path("ProjectSettings/ProjectVersion.txt")
          if not pv_path.is_file():
              raise SystemExit("Missing ProjectSettings/ProjectVersion.txt")
          pv_text = pv_path.read_text(encoding="utf-8", errors="replace")
          m_unity = re.search(r"^m_EditorVersion:\s*(\S+)", pv_text, re.MULTILINE)
          if not m_unity:
              raise SystemExit("Could not parse m_EditorVersion from ProjectVersion.txt")
          unity_version = m_unity.group(1).strip()

          app_version = os.environ.get("INPUT_APP_VERSION", "").strip()
          if not app_version:
              for cl_name in ("Changelog-ZH.md", "Changelog.md"):
                  cl_path = Path(cl_name)
                  if cl_path.is_file():
                      cl_text = cl_path.read_text(encoding="utf-8-sig", errors="replace")
                      m_ver = re.search(r"^#\s+v?(\d+\.\d+(?:\.\d+)?)\b", cl_text, re.MULTILINE)
                      if m_ver:
                          app_version = m_ver.group(1).strip()
                          break

          if not app_version:
              ps_text = Path("ProjectSettings/ProjectSettings.asset").read_text(encoding="utf-8", errors="replace")
              m_bv = re.search(r"^\s*bundleVersion:\s*(\S+)", ps_text, re.MULTILINE)
              app_version = m_bv.group(1).strip() if m_bv else "0.0.0"

          build_number = os.environ.get("INPUT_BUILD_NUMBER", "").strip()
          if not build_number:
              parts = [int(p) for p in re.findall(r"\d+", app_version)[:3]]
              while len(parts) < 3:
                  parts.append(0)
              derived = parts[0] * 1000 + parts[1] * 100 + parts[2]
              build_number = str(derived if derived > 0 else 1)

          ps_path = Path("ProjectSettings/ProjectSettings.asset")
          ps_text = ps_path.read_text(encoding="utf-8", errors="replace")
          ps_text = re.sub(
              r"^(\s*bundleVersion:\s*).*$",
              rf"\g<1>{app_version}",
              ps_text,
              count=1,
              flags=re.MULTILINE,
          )
          ps_text = re.sub(
              r"(buildNumber:\s*\n(?:[ \t]+\w+:\s*\S+\n)*?[ \t]+iPhone:\s*)\S+",
              rf"\g<1>{build_number}",
              ps_text,
              count=1,
          )
          ps_path.write_text(ps_text, encoding="utf-8")

          artifact_base = f"MinecraftVSZombies2-{app_version}-iOS-unsigned"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"unity_version={unity_version}\n")
              out.write(f"app_version={app_version}\n")
              out.write(f"build_number={build_number}\n")
              out.write(f"artifact_base={artifact_base}\n")

          print(f"Resolved Unity={unity_version}, AppVersion={app_version}, BuildNumber={build_number}")
          PY

      - name: Normalize legacy CSharp source encodings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          legacy = []
          unknown = []

          for path in sorted(Path("Assets").rglob("*.cs")):
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              try:
                  raw.decode("utf-8-sig")
                  continue
              except UnicodeDecodeError:
                  pass

              try:
                  text = raw.decode("gb18030")
              except UnicodeDecodeError as exc:
                  unknown.append((str(path), str(exc)))
                  continue

              path.write_text(text, encoding="utf-8-sig", newline="\n")
              legacy.append(str(path))

          if unknown:
              for path, error in unknown:
                  print(f"UNKNOWN_ENCODING\t{path}\t{error}")
              raise SystemExit("Found C# files that are neither UTF-8 nor GB18030")

          talk = Path("Assets/Scripts/Editor/Menus/TalkConverter.cs")
          if talk.is_file():
              text = talk.read_text(encoding="utf-8-sig")
              replacements = {
                  "'【'": r"'\u3010'",
                  "'】'": r"'\u3011'",
                  "'（'": r"'\uFF08'",
                  "'）'": r"'\uFF09'",
                  "'：'": r"'\uFF1A'",
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              talk.write_text(text, encoding="utf-8-sig", newline="\n")

          invalid_after = []
          for path in sorted(Path("Assets").rglob("*.cs")):
              if not path.is_file():
                  continue
              try:
                  path.read_bytes().decode("utf-8-sig")
              except UnicodeDecodeError as exc:
                  invalid_after.append((str(path), str(exc)))
          if invalid_after:
              for path, error in invalid_after:
                  print(f"STILL_INVALID\t{path}\t{error}")
              raise SystemExit("C# UTF-8 normalization verification failed")

          options_path = Path("Assets/Scripts/MVZ2/Options/Dialog/OptionsDialogController.cs")
          if options_path.is_file():
              options = options_path.read_text(encoding="utf-8-sig")
              expected = ("音乐音量：{0}", "音效音量：{0}", "更多选项", "难度：{0}")
              missing = [item for item in expected if item not in options]
              if missing:
                  print(f"::warning::Options text check did not find {missing!r} (upstream strings may have changed)")
              else:
                  print("Options Chinese string verification passed")

          print(f"LEGACY_CSHARP_TRANSCODED_COUNT={len(legacy)}")
          for path in legacy:
              print(f"TRANSCODED_GB18030_TO_UTF8\t{path}")
          PY

      - name: Verify Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "::error::No Unity activation secret is configured. Add UNITY_LICENSE (Personal .ulf contents) or UNITY_SERIAL (Pro/Plus), plus UNITY_EMAIL and UNITY_PASSWORD."
            exit 1
          fi
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::UNITY_EMAIL and UNITY_PASSWORD are required by the Unity activation step."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ steps.meta.outputs.unity_version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-${{ steps.meta.outputs.unity_version }}-

      - name: Export Unity iOS Xcode project
        id: unity_export
        continue-on-error: true
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          MVZ2_APP_VERSION: ${{ steps.meta.outputs.app_version }}
          MVZ2_BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
        with:
          unityVersion: ${{ steps.meta.outputs.unity_version }}
          versioning: Custom
          version: ${{ steps.meta.outputs.app_version }}
          targetPlatform: iOS
          buildsPath: build
          buildName: iOS
          allowDirtyBuild: true
          cacheUnityInstallationOnMac: true

      - name: Capture Unity error summary
        id: unity_error
        if: steps.unity_export.outcome == 'failure'
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/unity-error-summary.txt"
          : > "$OUT"

          {
            echo "===== game-ci / Unity log files found ====="
            for candidate in \
              "$GITHUB_WORKSPACE/out.log" \
              "$HOME/.game-ci/game-ci.log" \
              "$HOME/Library/Logs/Unity/Editor.log"; do
              if [[ -f "$candidate" ]]; then
                printf '%s (%s bytes)\n' "$candidate" "$(wc -c < "$candidate" | tr -d ' ')"
              fi
            done
            find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -maxdepth 5 -type f \( -name 'out.log' -o -name 'Editor.log' -o -name '*unity*.log' -o -name 'game-ci.log' \) -print 2>/dev/null | sort -u || true

            echo
            echo "===== Project out.log errors ====="
            if [[ -f "$GITHUB_WORKSPACE/out.log" ]]; then
              grep -nEi 'error CS[0-9]+|BuildFailedException|Build failed|Compilation failed|Scripts have compiler errors|Player build failed|Error building Player|Exception:|IL2CPP|Addressables|error:' "$GITHUB_WORKSPACE/out.log" | tail -220 || true
              echo "----- out.log tail -----"
              tail -260 "$GITHUB_WORKSPACE/out.log" || true
            else
              echo "No $GITHUB_WORKSPACE/out.log"
            fi

            echo
            echo "===== game-ci log errors ====="
            if [[ -f "$HOME/.game-ci/game-ci.log" ]]; then
              grep -nEi 'error|fail|exception|exit code' "$HOME/.game-ci/game-ci.log" | tail -160 || true
              echo "----- game-ci.log tail -----"
              tail -180 "$HOME/.game-ci/game-ci.log" || true
            else
              echo "No $HOME/.game-ci/game-ci.log"
            fi
          } > "$OUT"

          python3 - "$OUT" "$GITHUB_OUTPUT" <<'PY'
          from pathlib import Path
          import sys, uuid
          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          text = src.read_text(encoding="utf-8", errors="replace")
          if len(text) > 30000:
              text = "[truncated to last 30000 chars]\n" + text[-30000:]
          marker = "UNITYERR_" + uuid.uuid4().hex
          with dst.open("a", encoding="utf-8") as f:
              f.write(f"summary<<{marker}\n{text}\n{marker}\n")
          PY

          cat "$OUT"

      - name: Locate Xcode project
        id: xcode
        if: steps.unity_export.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find build -type d -name 'Unity-iPhone.xcodeproj' -print -quit)"
          if [[ -z "$PROJECT" ]]; then
            echo "::error::Unity did not produce Unity-iPhone.xcodeproj."
            find build -maxdepth 4 -print || true
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found $PROJECT"

      - name: Build unsigned device app
        if: steps.unity_export.outcome == 'success'
        shell: bash
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          ARTIFACT_BASE: ${{ steps.meta.outputs.artifact_base }}
        run: |
          set -euo pipefail
          PROJECT="${{ steps.xcode.outputs.project }}"
          IPA_PATH="build/${ARTIFACT_BASE}.ipa"
          rm -rf build/DerivedData build/Payload "$IPA_PATH"

          xcodebuild \
            -project "$PROJECT" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          APP="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "::error::Xcode build completed but no .app bundle was found."
            find build/DerivedData/Build/Products -maxdepth 4 -print || true
            exit 1
          fi

          APP_PLIST="$APP/Info.plist"
          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST")"
          echo "IPA identity: bundle=$BUNDLE_ID version=$SHORT_VERSION build=$BUILD_VERSION"
          [[ "$SHORT_VERSION" == "$APP_VERSION" ]] || { echo "::error::Expected app version $APP_VERSION, got $SHORT_VERSION"; exit 1; }
          [[ "$BUILD_VERSION" == "$BUILD_NUMBER" ]] || { echo "::error::Expected iOS build $BUILD_NUMBER, got $BUILD_VERSION"; exit 1; }
          [[ "$BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]] || { echo "::error::Unexpected bundle ID $BUNDLE_ID"; exit 1; }

          mkdir -p build/Payload
          ditto "$APP" "build/Payload/$(basename "$APP")"
          (
            cd build
            /usr/bin/zip -qry "${ARTIFACT_BASE}.ipa" Payload
          )
          /usr/bin/unzip -l "$IPA_PATH" | head -80

      - name: Upload unsigned IPA
        if: steps.unity_export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_base }}
          path: build/${{ steps.meta.outputs.artifact_base }}.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build debug data on failure
        if: steps.unity_export.outcome == 'failure' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-debug
          path: |
            build
            out.log
            ~/.game-ci/game-ci.log
            ~/Library/Logs/Unity/Editor.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Mark Unity export failure
        if: steps.unity_export.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Unity iOS export failed; see the concise Unity error report job."
          exit 1

  unity-error-report:
    name: Unity concise error report
    needs: build-ios
    if: always() && needs.build-ios.outputs.unity_error_summary != ''
    runs-on: ubuntu-latest
    steps:
      - name: Print concise Unity failure
        shell: bash
        env:
          SUMMARY: ${{ needs.build-ios.outputs.unity_error_summary }}
        run: printf '%s\n' "$SUMMARY"
