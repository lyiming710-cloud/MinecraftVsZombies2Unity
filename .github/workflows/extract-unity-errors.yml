name: Extract Unity job errors

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: GitHub Actions job ID whose log should be inspected
        required: false
        default: "101526764250"
  push:
    branches:
      - ios-ipad-port
    paths:
      - ".github/workflows/extract-unity-errors.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    name: Extract Unity live tail
    runs-on: ubuntu-latest
    steps:
      - name: Download compact live tail
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          set -euo pipefail
          JOB_ID="${INPUT_JOB_ID:-101526764250}"
          LOG="$RUNNER_TEMP/unity-job.log"
          curl -L --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" \
            -o "$LOG"
          python3 - "$LOG" <<'PY'
          from pathlib import Path
          import re, sys
          text = Path(sys.argv[1]).read_text(encoding="utf-8-sig", errors="replace")
          text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
          lines = text.splitlines()
          fatal = re.compile(r"error CS\d+|BuildFailedException|Scripts have compiler errors|Aborting batchmode|Error building Player|Unhandled exception|\bfatal\b|##\[error\]|\*\* BUILD FAILED \*\*", re.I)
          hits = [i for i,l in enumerate(lines) if fatal.search(l)]
          print(f"log_lines={len(lines)} fatal_matches={len(hits)}")
          if hits:
              print("===== latest fatal matches =====")
              for i in hits[-12:]:
                  for j in range(max(0,i-3), min(len(lines),i+5)):
                      print(f"{j+1}: {lines[j]}")
                  print("---")
          print("===== latest 140 lines =====")
          for i,l in enumerate(lines[-140:], start=max(1,len(lines)-139)):
              print(f"{i}: {l}")
          PY
